<html>
  <head>
    <title>Openslide Test</title>
    <script language="javascript" type="module">
      import OpenSlide from "/openslide-wasm/dist/openslide.js";

      async function initialize() {
        window.openslide = new OpenSlide({workers: 4});
        console.log('created');
        await openslide.initialize();
        console.log('initialized');
      }

      document.addEventListener("DOMContentLoaded", () => {
        initialize();
      });

      const downloadRemoteCheckbox = document.getElementById("downloadRemote");
      const mppInput = document.getElementById("mpp");
      const numPartitionsInput = document.getElementById("num-partitions");
      const fileInput = document.getElementById("file");
      const remoteUrlInput = document.getElementById("remoteUrl");
      const loadRemoteButton = document.getElementById("loadRemote");
      const clearButton = document.getElementById("clear");
      const abortButton = document.getElementById("abort");
      const canvasContainer = document.getElementById("canvas-container");

      const handleSlide = async (slide) => {
        clearButton.onclick = async () => {
          console.log('closing...');
          await slide.close();
          fileInput.value = null;
          canvasContainer.innerHTML = "";
          console.log('closed');
        };
        console.log('opened');
        const slideMppStr = await slide.getPropertyValue("openslide.mpp-x");
        if (!slideMppStr) {
          console.error("No MPP property found");
          return;
        }
        const slideMpp = parseFloat(slideMppStr);
        console.log("Slide MPP", slideMpp);
        const mpp = parseFloat(mppInput.value);
        const numPartitions = parseInt(numPartitionsInput.value);
        canvasContainer.style.gridTemplateColumns = `repeat(${numPartitions}, auto)`;
        const downsample = mpp / slideMpp;
        const [width, height] = await slide.getLevelDimensions(0);
        const targetWidth = Math.round(width / downsample);
        const targetHeight = Math.round(height / downsample);
        console.log("Downsample", downsample);
        console.log("Target dims", targetWidth, targetHeight);
        const bestLevel = await slide.getBestLevelForDownsample(downsample);
        console.log("Best level for downsample", bestLevel);
        const [levelWidth, levelHeight] = await slide.getLevelDimensions(bestLevel);
        console.log('level dims', levelWidth, levelHeight);

        const regionWidth = Math.floor(width / numPartitions);
        const regionHeight = Math.floor(height / numPartitions);
        const regionLevelWidth = Math.floor(levelWidth / numPartitions);
        const regionLevelHeight = Math.floor(levelHeight / numPartitions);
        const regionTargetWidth = Math.floor(targetWidth / numPartitions);
        const regionTargetHeight = Math.floor(targetHeight / numPartitions);

        const regionPromises = [];
        const regionControllers = [];
        for (let j = 0; j < numPartitions; j++) {
          for (let i = 0; i < numPartitions; i++) {
            const x = i * regionWidth;
            const y = j * regionHeight;
            const regionController = new AbortController();
            regionControllers.push(regionController);
            const opts = {
              signal: regionController.signal,
            };
            const fn = async () => {
              try {
                const region = await slide.readRegion(x, y, bestLevel, regionLevelWidth, regionLevelHeight, opts);
                return region;
              } catch (err) {
                console.error("Error reading region", err);
                return null;
              }
            }
            regionPromises.push(fn());
          }
        }
        abortButton.onclick = () => {
          regionControllers.forEach((controller) => {
            console.log('aborting');
            controller.abort("Abort button clicked");
          });
        };
        console.time('readRegion');
        const allRegions = await Promise.all(regionPromises);
        console.timeEnd('readRegion');
        for (const region of allRegions) {
          const canvas = document.createElement("canvas");
          const ctx2d = canvas.getContext("2d");
          canvas.style.border = "1px solid black";
          canvas.width = regionTargetWidth;
          canvas.height = regionTargetHeight;

          if (region) {
            const imageData = new ImageData(region, regionLevelWidth, regionLevelHeight);

            // Resize the image tile data to the desired width and height
            const bitmap = await createImageBitmap(imageData, {
              resizeWidth: regionTargetWidth,
              resizeHeight: regionTargetHeight,
            });

            ctx2d.drawImage(bitmap, 0, 0);
          } else {
            // Draw a transparent black box when no image data is available
            ctx2d.fillStyle = "rgba(0, 0, 0, 0.8)";
            ctx2d.fillRect(0, 0, regionTargetWidth, regionTargetHeight);

            // Add warning symbol (exclamation mark)
            ctx2d.fillStyle = "yellow";
            ctx2d.beginPath();
            ctx2d.arc(regionTargetWidth / 2, regionTargetHeight / 2 - 15, 15, 0, Math.PI * 2);
            ctx2d.fill();

            // Draw exclamation mark
            ctx2d.fillStyle = "black";
            ctx2d.font = "bold 20px Arial";
            ctx2d.textAlign = "center";
            ctx2d.textBaseline = "middle";
            ctx2d.fillText("!", regionTargetWidth / 2, regionTargetHeight / 2 - 15);
          }
          canvasContainer.appendChild(canvas);
        };
      }

      // On file input change, load the file and display it
      fileInput.addEventListener("change", async (e) => {
        clearButton.onclick = null;
        const file = e.target.files[0];
        if (!file) return;
        console.log('file', file);
        try {
          const slide = await window.openslide.open(file);
          await handleSlide(slide);
        } catch (e) {
          console.error("Error handling slide!", e);
          return;
        }
      });

      loadRemoteButton.onclick = async () => {
        clearButton.onclick = null;
        const url = remoteUrlInput.value;
        if (!url) return;
        console.log('url', url);
        const downloadRemote = downloadRemoteCheckbox.checked;
        try {
          const slide = await window.openslide.open(url, downloadRemote);
          await handleSlide(slide);
        } catch (e) {
          console.error("Error handling slide!", e);
          return;
        }
      };
    </script>
  </head>
  <body>
    <div>
      <input type="file" id="file" name="SLIDE" />
    </div>
    <div>
      <input type="text" id="remoteUrl" placeholder="Remote URL" value="https://d3bzvr1k8ur14a.cloudfront.net/openslide-wasm/TCGA-LL-A7SZ-01Z-00-DX1.4DAF6421-6A1D-41C8-BFD6-859FE10CB8CC.svs" />
      <button id="loadRemote">Load Remote</button>
      <input type="checkbox" id="downloadRemote" />
      <label for="downloadRemote">Download Remote</label>
    </div>
    <div>
      <label for="mpp">MPP</label>
      <input type="number" id="mpp" placeholder="MPP" value="40.0" step="0.01"/>
    </div>
    <div>
      <label for="num-partitions">Partitions</label>
      <input type="number" id="num-partitions" placeholder="Num Partitions" value="4" step="1"/>
    </div>
    <div>
      <button id="clear">Clear</button>
      <button id="abort">Abort</button>
    </div>
    <div id="canvas-container" style="display: inline-grid; grid-template-columns: repeat(2, auto);">
    </div>
    </div>
  </body>
</html>
